[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mongoose"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Vue Router runs in history mode, so every other path loads the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
