# Netlify serves the Vue app and the legacy notes API. Live editing runs on the
# Cloudflare Worker in worker/ (deployed separately with `npm run deploy:worker`).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mongoose"]

# Read-only since the realtime editor: rooms import old notes from here once.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Vue Router runs in history mode, so every other path loads the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
